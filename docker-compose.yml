version: '3.8'

services:
  app:
    build: .
    container_name: rascafull-crm
    restart: unless-stopped
    ports:
      - "8484:8484"
      - "8485:8485"
    env_file:
      - .env
    environment:
      - PORT=8484
      - HEADLESS=true
      - BACKEND_URL=http://127.0.0.1:8484
      - CHROME_PATH=/usr/bin/chromium
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./logs:/app/logs
      - ./sessions:/app/sessions
      - ./bot:/app/bot
      - /app/bot/node_modules
      - ./bot_2:/app/bot_2
      - /app/bot_2/node_modules
      - ./bot_3:/app/bot_3
      - /app/bot_3/node_modules
      - ./bot_4:/app/bot_4
      - /app/bot_4/node_modules
    shm_size: '2gb'
